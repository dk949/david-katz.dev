# Single source of truth for build-time site data.
# Consumed by scripts/fetch-github.ts and baked into src/generated/github.json.

ignore:
    # owner/repo strings excluded from the auto-generated contributions list
    repos:
        - "FlicAnderson/PR_test"

    # users/orgs whose repos should never appear as contributions (e.g. dk949 itself)
    owners:
        - dk949
        - JumpCutter
        - Team-13-RLC
        - tacticalhippopotamus
    # language names excluded from the activity language breakdown
    languages:
        - TypeScript

contributions:
    # Max number of contribution cards to render on the activity page.
    # Sorted by merged-PR count (desc), then stars (desc).
    # Set to null/omit for no limit.
    limit: 12
    # Slugs always included in the contributions list, even if not surfaced by
    # the GitHub PR-author search (e.g. older or non-PR contributions).
    pinned:
        - xdslproject/xdsl

languages:
    # Max number of language slices in the breakdown bar (excluding "Other").
    # Anything beyond this is folded into the "Other" bucket. Default 8.
    limit: 8

projects:
    - name: Outlook URL Demangler
      url: https://url-demangler.david-katz.dev
      description: A tool to extract real URL after it gets mangled by Outlook
      tags: [tool]
    - name: IHPCSS Poster
      url: https://ihpcss-poster.david-katz.dev
      description: International HPC Summer School poster (tab to navigate)
      tags: [poster]

publications:
    # Schema: title, authors (list), venue, year, type, doi (optional), url (optional)
    # type: paper | preprint | talk | poster | thesis
    - title: An MLIR Lowering Pipeline for Stencils at Wafer-Scale
      authors: [Nicolai Stawinoga, David Katz, Anton Lydike, Justs Zarins, Nick Brown, George Bisbas, Tobias Grosser]
      venue: ASPLOS
      year: 2026
      type: paper
      doi: 10.1145/3779212.3790124
      url: https://dl.acm.org/doi/10.1145/3779212.3790124
    - title: An MLIR pipeline for offloading Fortran to FPGAs via OpenMP
      authors: [Gabriel Rodriguez-Canal, David Katz, Nick Brown]
      venue: SC25
      year: 2025
      type: paper
      doi: 10.1145/3731599.376748
      url: https://dl.acm.org/doi/10.1145/3731599.3767485
    - title: Implementing OpenMP for Zig to Enable Its Use in HPC Context
      authors: [David Katz, Nick Brown, Joseph Lee]
      venue: ICPP
      year: 2024
      type: paper
      doi: 10.1145/3677333.3678273
      url: https://dl.acm.org/doi/10.1145/3677333.3678273
