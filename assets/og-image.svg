<?xml version="1.0" encoding="UTF-8"?>
<!--
  Link-preview card (og:image), 1200x630. Source for public/og-image.png.

  Colours are the light Silicon + Copper tokens from @dk949/site-theme; the
  mark is the theme favicon. Text needs Archivo (wght 800, wdth 118) and
  JetBrains Mono installed locally. Re-export with:

    inkscape assets/og-image.svg -o public/og-image.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Wafer die grid -->
    <pattern id="dies" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#1b2026" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#e8eaed" />
  <rect width="1200" height="630" fill="url(#dies)" />
  <!-- Copper edge trace -->
  <rect x="0" y="0" width="12" height="630" fill="#96470a" />

  <!-- DK monogram -->
  <g transform="translate(110 225) scale(5.625)" fill="#96470a">
    <path d="M0 0 L0 4 L5.255 4 C7.042 4 8.447 4.485 9.468 5.455 C10.49 6.398 11 7.704 11 9.658 L11 22.562 C11 24.256 10.49 25.576 9.468 26.546 C8.447 27.516 7.042 28 5.255 28 L0 28 L0 32 L5.255 32 C7.269 32 9.014 31.591 10.489 30.773 C11.943 29.925 13.047 28.743 13.829 27.314 C14.61 25.967 15 24.391 15 22.562 L15 18 L19.534 18 L26.923 32 L32 32 L23.568 15.886 L31.592 0 L26.697 0 L19.624 14 L15 14 L15 9.658 C15 7.569 14.61 6.007 13.829 4.687 C13.047 3.258 11.943 2.091 10.489 1.273 C9.014 0.424 7.269 0 5.255 0 L0 0 Z M0 8 L0 24 L4 24 L4 8 L0 8 Z" />
  </g>

  <text x="380" y="318" fill="#1b2026" font-family="Archivo" font-weight="800" font-stretch="118%"
    font-size="104" letter-spacing="-2">David Katz</text>
  <rect x="384" y="346" width="72" height="5" rx="2.5" fill="#96470a" />
  <text x="384" y="410" fill="#3c454f" font-family="JetBrains Mono" font-size="26"
    letter-spacing="0.8">PhD researcher · HPC · compilers · LLVM/MLIR</text>

  <text x="110" y="560" xml:space="preserve" font-family="JetBrains Mono" font-size="26" letter-spacing="0.8"><tspan
      fill="#96470a">%</tspan><tspan fill="#59636e"> david-katz.dev</tspan></text>
</svg>
