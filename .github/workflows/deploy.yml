name: Scheduled rebuild

# Vercel builds on every push to trunk on its own. This only covers what it
# can't: a periodic rebuild so the activity page's GitHub data stays fresh.
# VERCEL_DEPLOY_HOOK is a Vercel deploy hook URL for trunk; anyone holding it
# can trigger a deploy, so it lives only in repo secrets.

on:
    schedule:
        - cron: "0 6 1,15 * *"
    workflow_dispatch:

permissions: {}

jobs:
    rebuild:
        runs-on: ubuntu-latest
        steps:
            - run: curl -fsS -X POST "$HOOK"
              env:
                  HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
